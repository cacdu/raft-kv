[package]
name = "raft-kv"
description = "Embeddable Raft-replicated key-value store: use as a library or run standalone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["raft", "consensus", "distributed", "database", "kv-store"]
categories = ["database-implementations", "network-programming", "concurrency"]

[lib]
name = "raft_kv"
path = "src/lib.rs"

[[bin]]
name = "raft-kv"
path = "src/main.rs"

[dependencies]
raft    = { path = "../raft" }
storage = { path = "../storage" }

tokio   = { workspace = true }
axum    = { workspace = true }
tower   = { workspace = true }
tower-http = { workspace = true }
tonic   = { workspace = true }
prost   = { workspace = true }
serde   = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
anyhow  = { workspace = true }
clap    = { workspace = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = { workspace = true }
