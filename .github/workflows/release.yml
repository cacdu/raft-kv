name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match workspace version $version" >&2
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked -p raft-kv -p client

      - name: Package artifacts
        run: |
          staging="raft-kv-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$staging"
          cp target/release/raft-kv target/release/raft-kv-cli "dist/$staging/"
          cp LICENSE README.md "dist/$staging/"
          tar -C dist -czf "dist/$staging.tar.gz" "$staging"
          (cd dist && sha256sum "$staging.tar.gz" > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
