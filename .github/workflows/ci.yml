name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Fmt check
        run: cargo fmt --all -- --check

  # Aggregator: the ONLY job referenced by branch protection on main.
  # Its name must stay "CI Gate" forever; jobs above can be renamed, split
  # or turned into matrices freely — just keep them listed in `needs`.
  gate:
    name: CI Gate
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed (got '$r')"
              exit 1
            fi
          done
