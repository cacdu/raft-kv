[workspace]
members = [
    "crates/raft",
    "crates/storage",
    "crates/server",
    "crates/client",
]
resolver = "2"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "3"
prost = "0.13"

# networking
tonic = "0.12"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utils
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
crc32fast = "1"
bytes = "1"
tempfile = "3"
